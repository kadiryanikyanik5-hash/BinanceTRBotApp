
name: Binance TR APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "BinanceTRBotApp_source.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check source ZIP
        run: |
          test -f BinanceTRBotApp_source.zip
          unzip -t BinanceTRBotApp_source.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q BinanceTRBotApp_source.zip -d android-project
          test -f android-project/settings.gradle -o -f android-project/settings.gradle.kts -o -f android-project/gradlew -o -f android-project/app/build.gradle -o -f android-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android-project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon assembleDebug
          else
            echo "Gradle wrapper or installed Gradle was not found."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BinanceTRBot-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
