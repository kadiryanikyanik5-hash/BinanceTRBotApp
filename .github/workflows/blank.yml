
name: Binance TR APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - "BinanceTRBotApp_source.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check and extract ZIP
        run: |
          test -f BinanceTRBotApp_source.zip
          unzip -t BinanceTRBotApp_source.zip
          mkdir -p android-project
          unzip -q BinanceTRBotApp_source.zip -d android-project
          echo "ZIP extracted successfully"
          find android-project -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        run: |
          ROOT=""
          WRAPPER=$(find android-project -type f -name gradlew -print -quit)
          if [ -n "$WRAPPER" ]; then
            ROOT=$(dirname "$WRAPPER")
          else
            SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -n "$SETTINGS" ]; then
              ROOT=$(dirname "$SETTINGS")
            fi
          fi
          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            exit 1
          fi
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project directory: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BinanceTRBot-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
